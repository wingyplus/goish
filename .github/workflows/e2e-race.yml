name: e2e-race

# Nightly race sweep: the per-test loop tiers, which put the
# scheduling/racing/stress families at 50 iterations each
# (chan/select, preempt, sched, sync, timers, stacks, server lifecycle,
# TLS conns — see loops_for in scripts/e2e_runner.sh).
#
# 50 is not a round number picked for comfort: the historical lost-wakeup
# bug reproduced ~2% of the time, so 10 loops would have hidden it ~80% of
# the time. This is the run that would catch its successor.
#
# The per-push gate (e2e.yml) runs everything once and is the fast signal;
# this is the slow one, so it runs while nobody is waiting on it.

on:
  schedule:
    # 18:00 UTC — early night in UTC+7, so results are waiting by morning.
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "tiered = per-test tiers (1/10/50); full = every example x50"
        type: choice
        default: tiered
        options: [tiered, full]
        required: false

# Never run two nightlies at once — a manual dispatch during a scheduled
# run should replace it, not queue behind it.
concurrency:
  group: e2e-race
  cancel-in-progress: true

jobs:
  e2e-race:
    # Explicit per-entry names keep the pre-matrix check names
    # (`e2e-race`, `e2e-race-macos`).
    name: ${{ matrix.check }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      # One platform failing must not cancel the other's signal.
      fail-fast: false
      matrix:
        include:
          # `full` is 225 examples x 50 = ~11k iterations; give it room
          # but stay under GitHub's 360-minute per-job ceiling.
          - check: e2e-race
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            make: e2e
            make_full: e2e-full
            timeout: 330
          # darwin/arm64 allowlist under the same tiers. This is the only
          # native weak-memory signal in CI: x86's TSO hides every
          # too-weak `Ordering`, and the port plan's M12 audit is defined
          # as `e2e-darwin-full` green here. (Until workers land in M7 the
          # scheduler runs on one M, so the cross-thread orderings it is
          # waiting to test are not exercised yet.)
          - check: e2e-race-macos
            os: macos-latest
            target: aarch64-apple-darwin
            make: e2e-darwin
            make_full: e2e-darwin-full
            timeout: 120
    steps:
      - uses: actions/checkout@v4

      # The port is aarch64-only (every Darwin cfg names the arch), so an
      # Intel image would fail to build rather than test anything.
      - name: Require Apple Silicon
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      # The runner shells out to `timeout`, which macOS does not ship;
      # Homebrew's coreutils provides it as `gtimeout`.
      - name: Install coreutils
        if: runner.os == 'macOS'
        run: command -v gtimeout >/dev/null || brew install coreutils

      # Default (scheduled) runs are tiered. `full` is the AGENTS.md
      # requirement for scheduler/allocator/runtime-core changes, where
      # races surface in tests that look unrelated to the change — reach
      # for it by hand after touching runtime/.
      - name: make ${{ matrix.make }} (tiered)
        if: github.event.inputs.mode != 'full'
        run: make ${{ matrix.make }} TIMEOUT=30

      - name: make ${{ matrix.make_full }}
        if: github.event.inputs.mode == 'full'
        run: make ${{ matrix.make_full }} TIMEOUT=30

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.check }}-failure-logs
          path: scripts/.e2e-artifacts
          if-no-files-found: ignore
